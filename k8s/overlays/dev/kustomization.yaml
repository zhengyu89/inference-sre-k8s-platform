apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  # In-cluster Postgres (StatefulSet + PVC), plus the postgres-credentials
  # and backend-db-secret it defines — the backend picks up DATABASE_URL
  # from the latter with no further wiring needed here.
  - ../../base/postgres

# Scrape config for the inference worker's /metrics. Requires the monitoring
# Application (../../monitoring) to be synced first — it owns the ServiceMonitor CRD.
components:
  - ../../components/monitoring

