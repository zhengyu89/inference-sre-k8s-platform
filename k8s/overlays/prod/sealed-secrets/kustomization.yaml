apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Installs the Sealed Secrets controller (https://github.com/bitnami/sealed-secrets)
# via kustomize's Helm chart inflator generator, which requires --enable-helm:
#   kubectl kustomize --enable-helm k8s/overlays/prod | kubectl apply -f -
#
# fullnameOverride matches kubeseal's own CLI defaults (controller name
# "sealed-secrets-controller" in namespace "kube-system"), so `kubeseal`
# needs no --controller-name/--controller-namespace flags once this is
# deployed and running.
#
# This only manages the controller itself. Actual SealedSecret resources
# (e.g. for backend-db-secret) are generated by hand with `kubeseal` against
# the running controller's public cert and committed alongside it — see
# ../backend-db-secret.example.yaml for that workflow.
helmCharts:
- name: sealed-secrets
  repo: https://bitnami.github.io/sealed-secrets
  version: 2.19.3
  releaseName: sealed-secrets-controller
  namespace: kube-system
  valuesInline:
    fullnameOverride: sealed-secrets-controller
