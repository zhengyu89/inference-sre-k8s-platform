# Reference only — NOT applied by kustomize (it's not listed in this
# directory's kustomization.yaml resources) and not meant to ever hold a
# real value on disk. This documents the plaintext shape kustomize/the
# backend expect (a Secret named backend-db-secret with a single
# DATABASE_URL key) and the workflow for turning it into something safe to
# commit.
#
# Prod points at an external managed Postgres (e.g. Supabase) instead of
# pulling in ../../base/postgres like dev/stag do, so it needs its own
# backend-db-secret with that connection string — sealed with kubeseal
# rather than committed in plaintext or created by hand per-cluster:
#
#   1. Install the Sealed Secrets controller once per cluster (see
#      sealed-secrets/kustomization.yaml in this directory):
#        kubectl kustomize --enable-helm k8s/overlays/prod | kubectl apply -f -
#      (kubeseal's CLI defaults — controller name
#      "sealed-secrets-controller" in namespace "kube-system" — already
#      match how that chart is configured, so no extra kubeseal flags are
#      needed below.)
#
#   2. Write the real Secret to a file OUTSIDE this repo (never git add it):
#        kubectl create secret generic backend-db-secret \
#          --from-literal=DATABASE_URL='postgresql://USER:PASSWORD@HOST:5432/postgres?sslmode=require' \
#          --namespace <namespace> --dry-run=client -o yaml > /tmp/backend-db-secret.plain.yaml
#
#   3. Seal it into ciphertext only kubeseal's matching controller can
#      decrypt, then delete the plaintext file:
#        kubeseal --format yaml < /tmp/backend-db-secret.plain.yaml > backend-db-secret.sealed.yaml
#        rm /tmp/backend-db-secret.plain.yaml
#
#   4. Add backend-db-secret.sealed.yaml to this directory's
#      kustomization.yaml resources. The controller decrypts it in-cluster
#      into a regular Secret named backend-db-secret automatically — the
#      backend's envFrom (see ../../base/backend/deployment.yaml) needs no
#      changes.
#
# backend-db-secret.sealed.yaml is safe to commit: it's ciphertext, and only
# the controller instance that generated the keypair it was sealed against
# can ever decrypt it back to plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: backend-db-secret
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/postgres?sslmode=require"
