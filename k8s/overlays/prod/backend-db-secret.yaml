# Prod does not run the in-cluster Postgres from ../../base/postgres (that's
# only pulled in by dev/stag) — it points at an external managed Postgres
# instead (e.g. Supabase).
#
# Placeholders only: do not commit real credentials here. Apply this file
# after substituting the real values without committing that copy, e.g.
#   envsubst < backend-db-secret.yaml | kubectl apply -n <namespace> -f -
# or generate/manage it out of band (kubectl create secret generic
# backend-db-secret --from-literal=DATABASE_URL=... , or a proper secret
# manager / sealed-secrets / external-secrets setup) and drop it from
# `resources:` below once it's managed that way.
apiVersion: v1
kind: Secret
metadata:
  name: backend-db-secret
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/postgres?sslmode=require"
