apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  strategy: {}
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # Frontend proxies /api/ to the backend (see frontend/docker/nginx.conf.template)
      # and has nothing useful to serve until it's reachable.
      initContainers:
      - name: wait-for-backend
        image: busybox:1.36
        command:
        - sh
        - -c
        - until wget -q -O- http://backend:3000/health/ready; do echo waiting for backend; sleep 2; done
      containers:
      - image: ivantan67/inference-sre-frontend:v1
        name: inference-sre-frontend
        ports:
        - name: http
          containerPort: 80

        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 1
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3

        resources: 
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
status: {}
