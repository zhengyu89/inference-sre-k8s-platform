# The backend reads a single DATABASE_URL (see backend/src/config/index.ts),
# composed here from postgres-credentials.yaml's values. Kustomize has no
# built-in way to build this string from the other Secret's keys, so keep
# the two files in sync by hand.
#
# PreSync hook at sync-wave -3 — the backend-migrate Job (wave -1, see
# backend/migrate-job.yaml) envFrom's this Secret in its main container. As a
# plain resource it wouldn't exist until the normal Sync phase, which starts
# only after PreSync hooks succeed, so migrate's container would fail with
# CreateContainerConfigError waiting on a Secret Argo CD hasn't created yet.
apiVersion: v1
kind: Secret
metadata:
  name: backend-db-secret
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/inference_sre?sslmode=disable"
