apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  # Headless — gives the StatefulSet pod a stable DNS identity
  # (postgres-0.postgres) as well as the plain `postgres` name the backend
  # connects to.
  clusterIP: None
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
