# Dev-grade default credentials, mirroring docker-compose.yml so local and
# in-cluster behave the same. Only dev/stag pull this in (see their
# kustomization.yaml) — prod uses an external managed Postgres instead
# (k8s/overlays/prod/backend-db-secret.yaml) and never references this file.
# Replace these before this is reachable from anywhere but a local cluster.
#
# PreSync hook at sync-wave -3 — one step ahead of the postgres StatefulSet
# (wave -2, see postgres/statefulset.yaml), which envFrom's this Secret. Left
# as a plain resource, it wouldn't be created until the normal Sync phase,
# which only starts once all PreSync hooks (including postgres itself)
# succeed — the StatefulSet would fail with CreateContainerConfigError
# waiting on a Secret Argo CD hasn't created yet.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: inference_sre
