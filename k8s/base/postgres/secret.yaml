# Dev-grade default credentials, mirroring docker-compose.yml so local and
# in-cluster behave the same. Only dev/stag pull this in (see their
# kustomization.yaml) — prod uses an external managed Postgres instead
# (k8s/overlays/prod/backend-db-secret.yaml) and never references this file.
# Replace these before this is reachable from anywhere but a local cluster.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: inference_sre
