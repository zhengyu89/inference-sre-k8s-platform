apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - name: postgres
          containerPort: 5432

        envFrom:
        - secretRef:
            name: postgres-credentials
        env:
        # Write into a subdirectory of the mount, not its root — some CSI
        # drivers seed the mount root with a lost+found dir that trips up
        # postgres's "data directory is not empty" check otherwise.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata

        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data

        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
          periodSeconds: 5
          timeoutSeconds: 3

        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      # Named explicitly rather than left to whatever the cluster's default
      # happens to be. Docker Desktop's Kubernetes (which runs on kind under
      # the hood — see its rancher.io/local-path StorageClasses and
      # desktop-control-plane/desktop-worker* node names) already ships this
      # as its default class; pointed at a different cluster, swap this for
      # whatever that cluster's default/preferred class is named.
      storageClassName: standard
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
