apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: inference-worker
  name: inference-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-worker
  strategy: {}
  template:
    metadata:
      labels:
        app: inference-worker
    spec:
      # Ordering-only: the worker has no functional dependency on Postgres
      # (see inference-worker/app/config.py — no DB/Redis client at all),
      # this just makes the cluster's bring-up order predictable
      # (Redis -> Postgres -> Worker -> backend -> frontend) on a fresh
      # `kubectl apply -k`.
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
      - image: ivantan67/inference-sre-worker:v1
        name: inference-worker
        ports:
        - name: http
          containerPort: 8000

        env:
        - name: MODEL_NAME
          value: classifier
        - name: MODEL_VERSION
          value: v1
        - name: WORKER_ID
          value: worker-01

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2

        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6
status: {}
