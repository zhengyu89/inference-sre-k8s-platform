apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: inference-worker
  name: inference-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-worker
  strategy: {}
  template:
    metadata:
      labels:
        app: inference-worker
    spec:
      containers:
      # imagePullPolicy: Always — see backend/deployment.yaml for why (mutable
      # tag, bit us live during development of this manifest).
      - image: ivantan67/inference-sre-worker:v1
        imagePullPolicy: Always
        name: inference-worker
        ports:
        - name: http
          containerPort: 8000

        env:
        - name: MODEL_NAME
          value: classifier
        - name: MODEL_VERSION
          value: v1
        - name: WORKER_ID
          value: worker-01

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2

        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6
status: {}
