apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy: {}
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - image: ivantan67/inference-sre-api:v1
        name: inference-sre-api
        ports:
        - containerPort: 3000

        # PORT/REDIS_URL come from the backend-config ConfigMap (same in
        # every overlay); DATABASE_URL comes from a backend-db-secret that
        # each overlay supplies itself — dev/stag get it for free from
        # ../../base/postgres (in-cluster), prod brings its own pointing at
        # an external managed Postgres.
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-db-secret

        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 1

        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
status: {}
