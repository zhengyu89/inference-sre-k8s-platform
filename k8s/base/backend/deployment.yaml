apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy: {}
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      # imagePullPolicy: Always because this tag is mutable and gets
      # overwritten in place rather than incrementing per build — without
      # this, a node that already pulled a stale v2 keeps reusing it
      # (kubelet's default IfNotPresent) even after a newer image is pushed
      # under the same tag, exactly as happened live during development here.
      - image: ivantan67/inference-sre-api:v2
        imagePullPolicy: Always
        name: inference-sre-api
        ports:
        - containerPort: 3000

        # PORT/REDIS_URL come from the backend-config ConfigMap (same in
        # every overlay); DATABASE_URL comes from a backend-db-secret that
        # each overlay supplies itself — dev/stag get it for free from
        # ../../base/postgres (in-cluster), prod brings its own pointing at
        # an external managed Postgres.
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-db-secret
        resources: 
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        # Readiness reflects real dependency state (see backend/src/index.ts
        # /health/ready — checks Postgres+Redis, not the worker: workerClient
        # already degrades per-request to a 502 rather than needing the whole
        # backend pulled from service over it). Liveness/startup stay on
        # /health (process-alive only) so a transient DB/cache outage gets
        # this pod marked NotReady, not killed.
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 1

        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
status: {}
