apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy: {}
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Backend genuinely needs all three reachable (DATABASE_URL, REDIS_URL,
      # WORKER_URL — see backend/src/config/index.ts) — this isn't just
      # ordering, it fails to become ready without them anyway. Checking
      # them here means a backend restart doesn't get stuck depending on
      # every other pod's init containers having already run once.
      initContainers:
      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 redis 6379; do echo waiting for redis; sleep 2; done
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 postgres 5432; do echo waiting for postgres; sleep 2; done
      - name: wait-for-worker
        image: busybox:1.36
        command:
        - sh
        - -c
        - until wget -q -O- http://inference-worker:8000/health/ready; do echo waiting for inference-worker; sleep 2; done
      containers:
      - image: ivantan67/inference-sre-api:v1.0.0
        name: inference-sre-api
        ports:
        - containerPort: 3000

        # PORT/REDIS_URL come from the backend-config ConfigMap (same in
        # every overlay); DATABASE_URL comes from a backend-db-secret that
        # each overlay supplies itself — dev/stag get it for free from
        # ../../base/postgres (in-cluster), prod brings its own pointing at
        # an external managed Postgres.
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-db-secret
        resources: 
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 1

        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
status: {}
