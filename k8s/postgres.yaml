# Minimal single-replica Postgres for local/dev clusters. The README's
# target design uses a StatefulSet (and external Supabase in production) —
# that's a future iteration; this is enough to demonstrate the platform's
# connectivity on Kubernetes today.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: inference-sre
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: inference_sre
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: inference-sre
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: inference-sre
spec:
  replicas: 1
  # A single ReadWriteOnce volume can't be mounted by two pods at once, so
  # the old pod must terminate before the new one starts on rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "inference_sre"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "inference_sre"]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: inference-sre
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
